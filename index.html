<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schulden-Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E7B4F">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#F6F7F4;--c:#fff;--ink:#1B2421;--mu:#5E6B66;--ln:#D5DAD6;--g:#1E7B4F;--gb:#DDF0E5;--r:#C0392B;--rb:#FDEEEB;--y:#7A5C00;--yb:#FEF6D6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--c:#1D2421;--ink:#EEF2EF;--mu:#9AA6A0;--ln:#34403B;--g:#5FD39A;--gb:#1B3A2B;--r:#FF8A7A;--rb:#3F1F1B;--y:#F2CF63;--yb:#3A3216}}
:root[data-theme="dark"]{--bg:#121715;--c:#1D2421;--ink:#EEF2EF;--mu:#9AA6A0;--ln:#34403B;--g:#5FD39A;--gb:#1B3A2B;--r:#FF8A7A;--rb:#3F1F1B;--y:#F2CF63;--yb:#3A3216}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px 'DM Sans',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:22px 18px 96px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:26px}h2{margin:6px 0 0;font-size:16px}
.c{background:var(--c);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:0;color:inherit;font:inherit;text-align:left;width:100%;box-sizing:border-box}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.s{display:flex;gap:8px}.s>.q,.s>button{flex:1}
.w{display:flex;gap:8px;flex-wrap:wrap}
.f{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.g{color:var(--g)}.o{color:var(--r)}.y{color:var(--y)}.m{font-size:13px;color:var(--mu)}.big{font-size:22px}
.rr{background:var(--rb)}.ry{background:var(--yb)}
.t{font-style:normal;font-size:12px;padding:3px 9px;border-radius:99px;font-weight:500;background:var(--ln);color:var(--mu)}.tr{background:var(--rb);color:var(--r)}.ty{background:var(--yb);color:var(--y)}.tg{background:var(--gb);color:var(--g)}
.b{background:var(--ink);color:var(--bg);border:0;border-radius:14px;height:52px;font:500 16px inherit;font-family:inherit;cursor:pointer}
.b2{background:var(--c);color:var(--ink);border:1px solid var(--ln);border-radius:12px;height:46px;font:500 14px inherit;font-family:inherit;cursor:pointer}
.i{height:48px;border:1px solid var(--ln);border-radius:12px;padding:0 14px;font:15px inherit;font-family:inherit;background:var(--c);color:var(--ink);box-sizing:border-box;width:100%}
.q{height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:var(--c);color:var(--ink);font:13px inherit;font-family:inherit;cursor:pointer}
.qa{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bk{align-self:flex-start;background:none;border:0;color:var(--mu);font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
.bar{height:8px;border-radius:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;width:100%}
nav button{flex:1;height:58px;border:0;background:none;color:var(--mu);font:13px inherit;font-family:inherit;cursor:pointer}
nav .on{color:var(--ink);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--g);color:#fff;font:500 15px inherit;font-family:inherit;box-shadow:0 2px 10px #0003;cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{color:#06281A}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const T={ov:['Übersicht','Overview','Aperçu'],debts:['Schulden','Debts','Dettes'],ppl:['Personen','People','Personnes'],set:['Einstellungen','Settings','Réglages'],
owedMe:['Man schuldet mir','Owed to me','On me doit'],iowe:['Ich schulde','I owe','Je dois'],bal:['Saldo','Balance','Solde'],due:['Fällig','Due','Échu'],over:['Überfällig','Overdue','En retard'],
dueList:['Fällig & überfällig','Due & overdue','Échus et en retard'],all:['Alle','All','Tous'],fIn:['Ich bekomme','I receive','Je reçois'],
hist:['Historie','History','Historique'],byP:['Auswertung pro Person','By person','Par personne'],byU:['Nach Zweck','By purpose','Par motif'],
nd:['Neue Schuld','New debt','Nouvelle dette'],give:['Ich gebe Geld','I lend money','Je prête'],get:['Ich bekomme Geld','I borrow money','J’emprunte'],
person:['Person','Person','Personne'],np:['+ Neue Person','+ New person','+ Nouvelle personne'],name:['Name','Name','Nom'],amt:['Betrag (€)','Amount (€)','Montant (€)'],rate:['Zinssatz (%)','Interest rate (%)','Taux (%)'],
why:['Wofür?','What for?','Pour quoi ?'],ch:['Wie gegeben / erhalten?','How was it paid?','Comment ?'],cash:['Bar','Cash','Espèces'],pp:['PayPal','PayPal','PayPal'],bank:['Überweisung','Bank transfer','Virement'],combo:['Kombiniert','Combined','Combiné'],
date:['Datum','Date','Date'],dueBy:['Rückgabe bis','Due by','À rendre avant'],save:['Speichern','Save','Enregistrer'],
bike:['Fahrrad','Bike','Vélo'],food:['Essen','Food','Repas'],rent:['Miete','Rent','Loyer'],lic:['Führerschein','Driving licence','Permis'],cus:['+ Eigener Zweck','+ Custom','+ Autre motif'],
post:['Rückgabe verschieben','Postpone repayment','Reporter le remboursement'],nf:['Neue Frist','New deadline','Nouvelle échéance'],late:['Verzugszinsen','Late interest','Intérêts de retard'],fix:['Fester Betrag (€)','Fixed amount (€)','Montant fixe (€)'],pct:['Prozent (%)','Percent (%)','Pourcentage (%)'],note:['Notiz','Note','Note'],
pay:['Rückzahlung','Repayment','Remboursement'],int:['Zinsen aufschlagen','Add interest','Ajouter des intérêts'],intE:['Zinsen','Interest','Intérêts'],
paid:['Zurückgezahlt','Repaid','Remboursé'],done:['Erledigt','Done','Soldé'],gave:['Geld gegeben','Money lent','Argent prêté'],got:['Geld erhalten','Money received','Argent reçu'],
pw:['Passwort','Password','Mot de passe'],unl:['Entsperren','Unlock','Déverrouiller'],setpw:['Passwort festlegen','Set password','Définir le mot de passe'],skip:['Ohne Passwort fortfahren','Continue without password','Continuer sans mot de passe'],bad:['Falsches Passwort','Wrong password','Mot de passe incorrect'],
chpw:['Passwort ändern','Change password','Changer le mot de passe'],lang:['Sprache','Language','Langue'],lock:['Jetzt sperren','Lock now','Verrouiller'],ok:['Gespeichert','Saved','Enregistré'],
none:['Keine offenen Posten','No open items','Aucun poste ouvert'],back:['‹ Zurück','‹ Back','‹ Retour'],total:['Offen','Open','Ouvert'],
split:['Aufteilung stimmt nicht mit dem Betrag überein','Split does not match the amount','La répartition ne correspond pas au montant'],
mon:['Mon.','mo.','mois'],prot:['Deine Daten sind mit einem Passwort geschützt.','Your data is protected by a password.','Vos données sont protégées par un mot de passe.'],add:['Hinzufügen','Add','Ajouter'],imp:['Backup laden (JSON)','Restore backup (JSON)','Restaurer la sauvegarde (JSON)'],share:['Teilen / in Cloud-Ordner sichern','Share / save to cloud folder','Partager / enregistrer dans le cloud'],gh:['GitHub-Sync','GitHub sync','Synchronisation GitHub'],ghHelp:['Privates Repository anlegen und einen Token mit „Contents: Read and write“ nur für dieses Repo erstellen.','Create a private repository and a token with “Contents: Read and write” for that repo only.','Créez un dépôt privé et un jeton « Contents : Read and write » pour ce dépôt uniquement.'],ghTok:['Token','Token','Jeton'],ghRepo:['Repository (Besitzer/Name)','Repository (owner/name)','Dépôt (propriétaire/nom)'],ghFile:['Dateiname','File name','Nom du fichier'],ghEnc:['Verschlüsselungs-Passwort (optional)','Encryption password (optional)','Mot de passe de chiffrement (facultatif)'],up:['Hochladen','Upload','Envoyer'],dn:['Herunterladen','Download','Télécharger'],ghOk:['Fertig','Done','Terminé'],ghErr:['Fehler','Error','Erreur'],ghNew:['Der Online-Stand ist neuer. Trotzdem überschreiben?','The online version is newer. Overwrite anyway?','La version en ligne est plus récente. Écraser ?'],ghNo:['Online nichts gefunden','Nothing found online','Rien trouvé en ligne'],impc:['Aktuelle Daten werden ersetzt. Fortfahren?','Current data will be replaced. Continue?','Les données actuelles seront remplacées. Continuer ?'],chan:['Kanal','Channel','Canal'],exp:['Daten exportieren','Export data','Exporter les données'],expb:['Backup (JSON)','Backup (JSON)','Sauvegarde (JSON)'],expc:['Tabelle (CSV)','Spreadsheet (CSV)','Tableur (CSV)']};
const LC=['de-DE','en-GB','fr-FR'];
let S,L=0,V={v:'home'},DOC=null,UNL=false;
const $=s=>document.querySelector(s),t=k=>(T[k]||[k,k,k])[L],uid=()=>Math.random().toString(36).slice(2,9);
const eur=x=>new Intl.NumberFormat(LC[L],{style:'currency',currency:'EUR'}).format(x);
const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),in7=()=>iso(new Date(Date.now()+6048e5));
const fd=s=>new Date(s+'T00:00').toLocaleDateString(LC[L]);
const addM=(s,m)=>{const x=new Date(s+'T00:00');x.setMonth(x.getMonth()+m);return iso(x)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=s=>parseFloat(String(s??'').replace(',','.'))||0;
const pl=p=>T[p]?t(p):p;
const bal=d=>d.h.reduce((a,e)=>a+(e.k=='pay'?-e.a:e.a),0);
const st=d=>bal(d)<=0.004?'paid':d.due<today()?'over':d.due<=in7()?'due':'open';
const DEC='inputmode="decimal"',DT='type="date"';
const dbt=()=>S.debts.find(d=>d.id==V.id),per=id=>S.people.find(p=>p.id==id);
async function H(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sm:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function load(){try{S=JSON.parse(localStorage.getItem('sm')||'null')}catch(e){}S=S||{pw:null,setup:false,lang:0,people:[],debts:[],ts:0};L=S.lang||0}
function save(){S.ts=Date.now();try{localStorage.setItem('sm',JSON.stringify(S))}catch(e){}if(DOC)DOC.set({json:JSON.stringify(S),ts:S.ts}).catch(()=>{})}
const go=(v,x={})=>{V={v,...x};scrollTo(0,0);render()};
const q=(k,v,l,cur)=>`<button class="q${cur==v?' qa':''}" data-a="set" data-k="${k}" data-v="${v}">${l}</button>`;
const inp=(k,l,x='')=>`<label class="f"><span class="m">${l}</span><input class="i" data-f="${k}" value="${esc(V.f[k]??'')}" ${x}></label>`;
const bk=()=>`<button class="bk" data-a="back">${t('back')}</button>`;
const err=()=>V.err?`<div class="o">${V.err}</div>`:'';
const bar=(v,mx)=>`<div class="bar" style="width:${Math.abs(v)/mx*100}%;background:var(${v>0?'--g':'--r'})"></div>`;
const chb=f=>`<div class="m">${t('ch')}</div><div class="w">${['cash','pp','bank','combo'].map(k=>q('ch',k,t(k),f.ch)).join('')}</div>${f.ch=='combo'?`<div class="s">${inp('sc',t('cash'),DEC)}${inp('sp',t('pp'),DEC)}${inp('sb',t('bank'),DEC)}</div>`:''}`;
function chl(e){if(e.ch=='combo'&&e.sp)return t('combo')+': '+[['cash',e.sp.cash],['pp',e.sp.pp],['bank',e.sp.bank]].filter(x=>x[1]).map(x=>t(x[0])+' '+eur(x[1])).join(' + ');return e.ch?t(e.ch):''}
function mk(f,k,a){const e={k,a,dt:f.date||today(),n:f.n||''};if(f.ch){e.ch=f.ch;if(f.ch=='combo'){e.sp={cash:n(f.sc),pp:n(f.sp),bank:n(f.sb)};if(Math.abs(e.sp.cash+e.sp.pp+e.sp.bank-a)>0.005){V.err=t('split');render();return null}}}return e}
function row(d){const p=per(d.pid),s=st(d);return `<button class="c ${s=='due'?'rr':s=='over'?'ry':''}" data-a="debt" data-id="${d.id}"><span class="r"><b>${esc(p?.name)}</b><b class="${s=='over'?'y':d.dir>0?'g':'o'}">${eur(bal(d))}</b></span><span class="r m"><span>${esc(pl(d.purpose))} · ${fd(d.due)}</span>${s=='due'?`<i class="t tr">${t('due')}</i>`:s=='over'?`<i class="t ty">${t('over')}</i>`:''}</span></button>`}
function histH(ds){const es=ds.flatMap(d=>d.h.map(e=>({e,d}))).sort((a,b)=>b.e.dt.localeCompare(a.e.dt));return es.map(({e,d})=>{const f=e.k=='init'?-d.dir:e.k=='pay'?d.dir:0,lab=e.k=='init'?t(d.dir>0?'gave':'got'):e.k=='pay'?t('pay'):e.k=='late'?t('late'):t('intE');
return `<div class="r"><div style="flex:1"><b>${lab}</b><div class="m">${[fd(e.dt),pl(d.purpose),chl(e),esc(e.n)].filter(Boolean).join(' · ')}</div></div><b class="${f>0?'g':f<0?'o':'y'}">${f>0?'+':f<0?'−':'+'}${eur(e.a)}</b></div>`}).join('')}
function home(){const o=S.debts.filter(d=>st(d)!='paid'),sm=s=>o.filter(d=>d.dir==s).reduce((a,d)=>a+bal(d),0),A=sm(1),B=sm(-1),dd=o.filter(d=>/due|over/.test(st(d)));
const net=S.people.map(p=>[p.name,S.debts.filter(d=>d.pid==p.id).reduce((a,d)=>a+d.dir*bal(d),0)]).filter(x=>Math.abs(x[1])>0.004).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])),mx=Math.max(1,...net.map(x=>Math.abs(x[1])));
const pu={};S.debts.forEach(d=>pu[d.purpose]=(pu[d.purpose]||0)+d.dir*d.h[0].a);const pe=Object.entries(pu).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])),mp=Math.max(1,...pe.map(x=>Math.abs(x[1])));
return `<h1>${t('ov')}</h1><div class="s"><div class="c f"><span class="m">${t('owedMe')}</span><b class="g big">${eur(A)}</b></div><div class="c f"><span class="m">${t('iowe')}</span><b class="o big">${eur(B)}</b></div></div>
<div class="c r"><span class="m">${t('bal')}</span><b class="big ${A>=B?'g':'o'}">${eur(A-B)}</b></div>
${dd.length?`<h2>${t('dueList')}</h2>${dd.map(row).join('')}`:''}
${net.length?`<div class="c"><h2>${t('byP')}</h2>${net.map(([nm,v])=>`<div class="r"><span>${esc(nm)}</span><b class="${v>0?'g':'o'}">${eur(v)}</b></div>${bar(v,mx)}`).join('')}</div>`:''}
${pe.length?`<div class="c"><h2>${t('byU')}</h2>${pe.map(([k,v])=>`<div class="r"><span>${esc(pl(k))}</span><b class="${v>0?'g':'o'}">${eur(v)}</b></div>${bar(v,mp)}`).join('')}</div>`:''}
<button class="fab" data-a="new">+ ${t('nd')}</button>`}
function debtsV(){const fl=V.fl||'all',o=S.debts.filter(d=>st(d)!='paid'&&(fl=='all'||d.dir==fl)).sort((a,b)=>a.due.localeCompare(b.due));
const c=(v,l)=>`<button class="q${fl==v?' qa':''}" data-a="fl" data-v="${v}">${l}</button>`;
return `<h1>${t('debts')}</h1><div class="w">${c('all',t('all'))}${c(1,t('fIn'))}${c(-1,t('iowe'))}</div>${o.length?o.map(row).join(''):`<div class="m">${t('none')}</div>`}<button class="fab" data-a="new">+ ${t('nd')}</button>`}
function pplV(){const ps=S.people.map(p=>[p,S.debts.filter(d=>d.pid==p.id).reduce((a,d)=>a+d.dir*bal(d),0)]);
return `<h1>${t('ppl')}</h1><div class="s"><input class="i" id="pn" placeholder="${t('name')}"><button class="b2" data-a="addp" style="flex:0 0 auto;padding:0 16px">${t('add')}</button></div>${ps.map(([p,v])=>`<button class="c" data-a="person" data-id="${p.id}"><span class="r"><b>${esc(p.name)}</b><b class="${v>0?'g':v<0?'o':'m'}">${eur(v)}</b></span></button>`).join('')}`}
function personV(){const p=per(V.id),ds=S.debts.filter(d=>d.pid==p.id),act=ds.filter(d=>st(d)!='paid'),pd=ds.filter(d=>st(d)=='paid'),v=act.reduce((a,d)=>a+d.dir*bal(d),0);
return `${bk()}<div class="r"><h1>${esc(p.name)}</h1><b class="big ${v>0?'g':v<0?'o':'m'}">${eur(v)}</b></div>${act.map(row).join('')}
<div class="c"><h2>${t('hist')}</h2>${histH(ds)||'—'}</div>${pd.length?`<div class="c"><h2>${t('paid')}</h2>${pd.map(d=>`<div class="r"><span>${esc(pl(d.purpose))} · ${eur(d.h[0].a)}</span><i class="t tg">${t('done')}</i></div>`).join('')}</div>`:''}
<button class="b" data-a="new" data-id="${p.id}">${t('nd')}</button>`}
function debtV(){const d=dbt(),p=per(d.pid),s=st(d),b=bal(d);
return `${bk()}<div class="c ${s=='due'?'rr':s=='over'?'ry':''}"><span class="m">${esc(p?.name)} · ${esc(pl(d.purpose))}</span><b class="big ${d.dir>0?'g':'o'}">${eur(b)}</b><span class="r m"><span>${t('dueBy')}: ${fd(d.due)}</span>${s=='due'?`<i class="t tr">${t('due')}</i>`:s=='over'?`<i class="t ty">${t('over')}</i>`:s=='paid'?`<i class="t tg">${t('done')}</i>`:''}</span></div>
${s!='paid'?`<button class="b" data-a="pay">${t('pay')}</button><div class="s"><button class="b2" data-a="adj" data-m="post">${t('post')}</button><button class="b2" data-a="adj" data-m="int">${t('int')}</button></div>`:''}
<div class="c"><h2>${t('hist')}</h2>${histH([d])}</div>`}
function newV(){const f=V.f;
return `${bk()}<h1>${t('nd')}</h1><div class="s">${q('dir',1,t('give'),f.dir)}${q('dir',-1,t('get'),f.dir)}</div>
<label class="f"><span class="m">${t('person')}</span><select class="i" data-f="pid" data-r>${S.people.map(p=>`<option value="${p.id}"${f.pid==p.id?' selected':''}>${esc(p.name)}</option>`).join('')}<option value="new"${f.pid=='new'?' selected':''}>${t('np')}</option></select></label>
${f.pid=='new'?inp('nn',t('name')):''}<div class="s">${inp('amt',t('amt'),DEC)}${inp('rate',t('rate'),DEC)}</div>
<div class="m">${t('why')}</div><div class="w">${['bike','food','rent','lic'].map(k=>q('pu',k,t(k),f.pu)).join('')}${q('pu','cus',t('cus'),f.pu)}</div>${f.pu=='cus'?inp('pc',t('why')):''}
${chb(f)}<div class="s">${inp('date',t('date'),DT)}${inp('due',t('dueBy'),DT)}</div>${err()}<button class="b" data-a="saveNew">${t('save')}</button>`}
function adjV(){const f=V.f,p=V.m=='post';
return `${bk()}<h1>${t(p?'post':'int')}</h1>${p?`<div class="m">${t('nf')}</div><div class="w">${[1,2,3].map(m=>q('mo',m,'+'+m+' '+t('mon'),f.mo)).join('')}</div>${inp('due',t('dueBy'),DT)}`:''}
<div class="m">${t(p?'late':'intE')}</div><div class="s">${q('ty','fix',t('fix'),f.ty)}${q('ty','pct',t('pct'),f.ty)}</div>${inp('val','',DEC)}${inp('n',t('note'))}<button class="b" data-a="saveAdj">${t('save')}</button>`}
function payV(){const f=V.f;return `${bk()}<h1>${t('pay')}</h1>${inp('amt',t('amt'),DEC)}${chb(f)}${inp('date',t('date'),DT)}${inp('n',t('note'))}${err()}<button class="b" data-a="savePay">${t('save')}</button>`}
function setV(){return `<h1>${t('set')}</h1><div class="m">${t('lang')}</div>${['Deutsch','English','Français'].map((x,i)=>`<button class="c r" data-a="lang" data-v="${i}" style="${L==i?'outline:2px solid var(--g)':''}"><span>${x}</span>${L==i?'<i class="t tg">✓</i>':''}</button>`).join('')}
<div class="c"><h2>${t('exp')}</h2><div class="s"><button class="b2" data-a="exp" data-k="json">${t('expb')}</button><button class="b2" data-a="exp" data-k="csv">${t('expc')}</button></div><button class="b2" data-a="imp">${t('imp')}</button><button class="b2" data-a="shr">${t('share')}</button><input type="file" id="fi" accept=".json,application/json" hidden></div><div class="c"><h2>${t('gh')}</h2><span class="m">${t('ghHelp')}</span><label class="f"><span class="m">${t('ghTok')}</span><input class="i" type="password" data-g="tok" value="${esc(GC.tok||'')}" autocomplete="off"></label><label class="f"><span class="m">${t('ghRepo')}</span><input class="i" type="text" data-g="repo" value="${esc(GC.repo||'')}" autocomplete="off"></label><label class="f"><span class="m">${t('ghFile')}</span><input class="i" type="text" data-g="file" value="${esc(GC.file||'')}" autocomplete="off"></label><label class="f"><span class="m">${t('ghEnc')}</span><input class="i" type="password" data-g="enc" value="${esc(GC.enc||'')}" autocomplete="off"></label><div class="s"><button class="b2" data-a="ghup">${t('up')}</button><button class="b2" data-a="ghdn">${t('dn')}</button></div>${V.gm?`<span class="m">${V.gm}</span>`:''}</div><div class="c"><h2>${t('pw')}</h2><input class="i" id="np" type="password" autocomplete="new-password" placeholder="${t('pw')}"><button class="b2" data-a="chp">${S.pw?t('chpw'):t('setpw')}</button>${V.msg?`<span class="g">${V.msg}</span>`:''}</div>${S.pw?`<button class="b2" data-a="lockn">${t('lock')}</button>`:''}`}
function lockV(){return `<div class="w" style="justify-content:flex-end">${['DE','EN','FR'].map((x,i)=>`<button class="q${L==i?' qa':''}" data-a="lang" data-v="${i}">${x}</button>`).join('')}</div><div style="margin-top:110px;display:flex;flex-direction:column;gap:14px"><h1>Schulden-Manager</h1><div class="m">${t('prot')}</div>
<input class="i" id="pw" type="password" autocomplete="current-password" placeholder="${t('pw')}">${V.bad?`<div class="o">${t('bad')}</div>`:''}<button class="b" data-a="${S.pw?'unl':'setp'}">${S.pw?t('unl'):t('setpw')}</button>${S.pw?'':`<button class="bk" data-a="skip">${t('skip')}</button>`}</div>`}
const VIEWS={home,debts:debtsV,ppl:pplV,set:setV,person:personV,debt:debtV,new:newV,adj:adjV,pay:payV};
function render(){let h;if(!S.setup||(S.pw&&!UNL))h=lockV();else{h=VIEWS[V.v]();if(['home','debts','ppl','set'].includes(V.v))h+=`<nav><div>${[['home','ov'],['debts','debts'],['ppl','ppl'],['set','set']].map(([k,l])=>`<button class="${V.v==k?'on':''}" data-a="nav" data-v="${k}">${t(l)}</button>`).join('')}</div></nav>`}
$('#app').innerHTML=h;document.documentElement.lang=['de','en','fr'][L]}
function saveNew(){const f=V.f,a=n(f.amt);if(a<=0||!f.due)return;const e=mk(f,'init',a);if(!e)return;e.r=n(f.rate);let pid=f.pid;
if(pid=='new'){if(!(f.nn||'').trim())return;pid=uid();S.people.push({id:pid,name:f.nn.trim()})}
S.debts.push({id:uid(),pid,dir:+f.dir,purpose:f.pu=='cus'?(f.pc||'—'):f.pu,due:f.due,h:[e]});save();go('person',{id:pid,bk:{v:'home'}})}
function saveAdj(){const d=dbt(),f=V.f,p=V.m=='post',v=n(f.val),a=f.ty=='pct'?bal(d)*v/100:v;if(a<=0&&!p)return;
if(a>0)d.h.push({k:p?'late':'int',a:Math.round(a*100)/100,dt:today(),n:f.n||''});if(p&&f.due)d.due=f.due;save();V=V.bk;render()}
function savePay(){const d=dbt(),f=V.f,a=n(f.amt);if(a<=0)return;const e=mk(f,'pay',a);if(!e)return;d.h.push(e);save();V=V.bk;render()}
document.addEventListener('input',e=>{const k=e.target.dataset.f;if(k&&V.f)V.f[k]=e.target.value});
document.addEventListener('change',async e=>{if(e.target.dataset.r!==undefined)render();if(e.target.id=='fi'&&e.target.files[0]){try{const r=JSON.parse(await e.target.files[0].text());if(Array.isArray(r.people)&&Array.isArray(r.debts)&&confirm(t('impc'))){S.people=r.people;S.debts=r.debts;save();go('home')}}catch(x){}e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='pw')$('#app [data-a=unl],#app [data-a=setp]').click()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.pw){UNL=false;V={v:'home'};render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset;V.err=null;
switch(a){
case'nav':go(D.v);break;
case'debt':go('debt',{id:D.id,bk:V});break;
case'person':go('person',{id:D.id,bk:V});break;
case'back':V=V.bk||{v:'home'};render();break;
case'fl':V.fl=D.v;render();break;
case'new':go('new',{bk:V,f:{dir:1,pid:D.id||S.people[0]?.id||'new',pu:'bike',ch:'cash',date:today(),due:addM(today(),1)}});break;
case'adj':{const d=dbt();go('adj',{m:D.m,id:d.id,bk:V,f:{ty:'fix',mo:2,due:addM(d.due>today()?d.due:today(),2)}});break}
case'pay':{const d=dbt();go('pay',{id:d.id,bk:V,f:{amt:String(Math.round(bal(d)*100)/100).replace('.',','),date:today(),ch:'cash'}});break}
case'set':V.f[D.k]=D.v;if(D.k=='mo'){const d=dbt();V.f.due=addM(d.due>today()?d.due:today(),+D.v)}render();break;
case'saveNew':saveNew();break;case'saveAdj':saveAdj();break;case'savePay':savePay();break;
case'addp':{const v=$('#pn').value.trim();if(v){S.people.push({id:uid(),name:v});save();render()}break}
case'lang':L=S.lang=+D.v;save();render();break;
case'unl':if(await H($('#pw').value)==S.pw){UNL=true;V={v:'home'};V.bad=0}else V.bad=1;render();break;
case'setp':{const v=$('#pw').value;if(!v)break;S.pw=await H(v);S.setup=UNL=true;save();render();break}
case'skip':S.setup=UNL=true;save();render();break;
case'chp':{const v=$('#np').value;if(!v)break;S.pw=await H(v);save();V.msg=t('ok');render();break}
case'lockn':UNL=false;render();break;
case'exp':exp(D.k);break;
case'imp':$('#fi').click();break;
case'shr':shr();break;case'ghup':ghDo(ghPush);break;case'ghdn':ghDo(ghPull);break;
}});
let GC={};try{GC=JSON.parse(localStorage.getItem('smgh')||'{}')}catch(e){}
document.addEventListener('input',e=>{const g=e.target.dataset.g;if(g){GC[g]=g=='enc'?e.target.value:e.target.value.trim();try{localStorage.setItem('smgh',JSON.stringify(GC))}catch(x){}}});
const B=u=>btoa(String.fromCharCode(...new Uint8Array(u))),U=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),TE=new TextEncoder();
async function key(p,s){const m=await crypto.subtle.importKey('raw',TE.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(x,p){const s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(p,s),TE.encode(x));return JSON.stringify({enc:1,s:B(s),iv:B(iv),d:B(c)})}
async function dec(j,p){const o=JSON.parse(j);if(!o.enc)return j;return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:U(o.iv)},await key(p,U(o.s)),U(o.d)))}
const ghU=()=>'https://api.github.com/repos/'+GC.repo+'/contents/'+encodeURIComponent(GC.file||'schulden-backup.json'),ghH=()=>({Authorization:'Bearer '+GC.tok,Accept:'application/vnd.github+json'});
async function ghGet(){const r=await fetch(ghU(),{headers:ghH()});if(r.status==404)return null;if(!r.ok)throw r.status;const j=await r.json();return{sha:j.sha,txt:new TextDecoder().decode(U(j.content.replace(/\s/g,'')))}}
const ghRead=async c=>JSON.parse(GC.enc?await dec(c.txt,GC.enc):c.txt);
async function ghPush(){const cur=await ghGet();let x=JSON.stringify({ts:S.ts,people:S.people,debts:S.debts});
if(cur){try{if((await ghRead(cur)).ts>S.ts&&!confirm(t('ghNew')))return 1}catch(e){}}
if(GC.enc)x=await enc(x,GC.enc);
const r=await fetch(ghU(),{method:'PUT',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify({message:'Backup '+today(),content:B(TE.encode(x)),sha:cur?.sha})});if(!r.ok)throw r.status;return 1}
async function ghPull(){const cur=await ghGet();if(!cur)return 0;const r=await ghRead(cur);if(!Array.isArray(r.people)||!Array.isArray(r.debts))throw 'format';if(!confirm(t('impc')))return 1;S.people=r.people;S.debts=r.debts;save();go('home');return 1}
async function ghDo(f){if(!GC.tok||!GC.repo){V.gm=t('ghErr')+': Token / Repository';render();return}V.gm='…';render();try{V.gm=(await f())===0?t('ghNo'):t('ghOk')}catch(e){V.gm=t('ghErr')+' ('+(e.message||e)+')'}render()}
async function shr(){const f=new File([JSON.stringify({ts:S.ts,people:S.people,debts:S.debts},null,1)],'schulden-'+today()+'.json',{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else exp('json')}catch(e){}}
async function exp(k){try{let data;const fn='schulden-'+today()+(k=='csv'?'.csv':'.json');
if(k=='csv'){const E=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[[t('date'),t('person'),t('debts'),t('why'),t('hist'),t('amt'),t('chan'),t('note')]];
S.debts.forEach(d=>d.h.forEach(e=>rows.push([e.dt,per(d.pid)?.name,d.dir>0?t('fIn'):t('iowe'),pl(d.purpose),e.k=='init'?t(d.dir>0?'gave':'got'):e.k=='pay'?t('pay'):e.k=='late'?t('late'):t('intE'),(e.k=='pay'?-e.a:e.a).toFixed(2).replace('.',L==1?'.':','),chl(e),e.n])));
data='\ufeff'+rows.map(r=>r.map(E).join(';')).join('\n')}
else data=JSON.stringify({ts:S.ts,people:S.people,debts:S.debts},null,1);
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:k=='csv'?'text/csv;charset=utf-8':'application/json'}));a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();render();
</script>
