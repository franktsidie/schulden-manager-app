<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schulden-Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E7B4F">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#F6F7F4;--c:#fff;--ink:#1B2421;--mu:#5E6B66;--ln:#D5DAD6;--g:#1E7B4F;--gb:#DDF0E5;--r:#C0392B;--rb:#FDEEEB;--y:#7A5C00;--yb:#FEF6D6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--c:#1D2421;--ink:#EEF2EF;--mu:#9AA6A0;--ln:#34403B;--g:#5FD39A;--gb:#1B3A2B;--r:#FF8A7A;--rb:#3F1F1B;--y:#F2CF63;--yb:#3A3216}}
:root[data-theme="dark"]{--bg:#121715;--c:#1D2421;--ink:#EEF2EF;--mu:#9AA6A0;--ln:#34403B;--g:#5FD39A;--gb:#1B3A2B;--r:#FF8A7A;--rb:#3F1F1B;--y:#F2CF63;--yb:#3A3216}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px 'DM Sans',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:22px 18px 96px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:26px}h2{margin:6px 0 0;font-size:16px}
.c{background:var(--c);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:0;color:inherit;font:inherit;text-align:left;width:100%;box-sizing:border-box}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.s{display:flex;gap:8px}.s>.q,.s>button{flex:1}
.w{display:flex;gap:8px;flex-wrap:wrap}
.f{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.g{color:var(--g)}.o{color:var(--r)}.y{color:var(--y)}.m{font-size:13px;color:var(--mu)}.big{font-size:22px}
.rr{background:var(--rb)}.ry{background:var(--yb)}
.t{font-style:normal;font-size:12px;padding:3px 9px;border-radius:99px;font-weight:500;background:var(--ln);color:var(--mu)}.tr{background:var(--rb);color:var(--r)}.ty{background:var(--yb);color:var(--y)}.tg{background:var(--gb);color:var(--g)}
.b{background:var(--ink);color:var(--bg);border:0;border-radius:14px;height:52px;font:500 16px inherit;font-family:inherit;cursor:pointer}
.b2{background:var(--c);color:var(--ink);border:1px solid var(--ln);border-radius:12px;height:46px;font:500 14px inherit;font-family:inherit;cursor:pointer}
.i{height:48px;border:1px solid var(--ln);border-radius:12px;padding:0 14px;font:15px inherit;font-family:inherit;background:var(--c);color:var(--ink);box-sizing:border-box;width:100%}
.q{height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:var(--c);color:var(--ink);font:13px inherit;font-family:inherit;cursor:pointer}
.qa{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bk{align-self:flex-start;background:none;border:0;color:var(--mu);font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
.bar{height:8px;border-radius:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;width:100%}
nav button{flex:1;height:58px;border:0;background:none;color:var(--mu);font:13px inherit;font-family:inherit;cursor:pointer}
nav .on{color:var(--ink);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--g);color:#fff;font:500 15px inherit;font-family:inherit;box-shadow:0 2px 10px #0003;cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{color:#06281A}}
.notice{padding:12px 14px;border:1px solid var(--ln);border-radius:12px;line-height:1.5;background:var(--c);overflow-wrap:anywhere}
.history{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.history>div:first-child{flex:1;min-width:180px;overflow-wrap:anywhere}.history .m{display:block;margin-top:4px}
.debt-row{margin-bottom:10px;min-height:66px;line-height:1.6;overflow-wrap:anywhere;cursor:pointer;border:1px solid var(--ln)}
#results{display:flex;flex-direction:column;gap:8px}.undo{padding:8px 0}.undo button{text-align:left;color:var(--g)}
.c{gap:12px}.c .b2{width:100%}.s>.c{flex:1;min-width:0}.s>.f{min-width:0}
.m{line-height:1.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--g);outline-offset:3px}
button:disabled,input:disabled,select:disabled{opacity:.6;cursor:wait}h1{overflow-wrap:anywhere}
.fab{right:max(18px,calc((100vw - 480px)/2 + 18px))}nav{z-index:3}
@media(max-width:360px){.s{flex-wrap:wrap}.s>.f{flex-basis:100%}.big{font-size:19px}.q{height:auto;min-height:38px;padding:8px 12px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="translations.js" defer></script>
<script src="core.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
